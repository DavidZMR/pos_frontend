# Instalador de Windows (NSIS). Ver skill pos-packaging.
appId: com.puntoventa.desktop
# Nombre visible (instalador, accesos directos, Programas y características). Ver electron/branding.cjs.
productName: El Atlántico
# Ejecutable y archivo del instalador en ASCII: sin acentos ni espacios en rutas.
executableName: ElAtlantico
copyright: Copyright © 2026 El Atlántico

directories:
  app: electron          # proceso principal + UI (electron/ui) → app.asar
  output: release
  buildResources: build-resources

files:
  - '**/*'
  - '!**/*.map'
  - '!lib/**/*.test.cjs'
  - '!lib/**/test-ports.cjs'
  # serialport trae binarios para todas las plataformas: solo se instala en Windows x64.
  - '!node_modules/@serialport/bindings-cpp/prebuilds/{android-*,darwin-*,linux-*,win32-arm64,win32-ia32}{,/**/*}'

# El binario nativo (.node) no puede cargarse desde dentro del asar.
asarUnpack:
  - 'node_modules/@serialport/bindings-cpp/prebuilds/win32-x64/**'

# Backend empaquetado en UN archivo (server.cjs, esbuild) + .env, fuera del asar.
# Sin node_modules: Defender revisa 1 archivo en lugar de miles en la primera apertura.
extraResources:
  - from: build/backend
    to: backend
    filter:
      - server.cjs
      - .env

asar: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: 'ElAtlantico-Setup-${version}.${ext}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: El Atlántico
  uninstallDisplayName: El Atlántico
