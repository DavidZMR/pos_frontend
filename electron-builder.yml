# Instalador de Windows (NSIS). Ver skill pos-packaging.
appId: com.puntoventa.desktop
productName: PuntoVenta
copyright: Copyright © 2026 PuntoVenta

directories:
  app: electron          # proceso principal + UI (electron/ui) → app.asar
  output: release
  buildResources: build-resources

files:
  - '**/*'
  - '!**/*.map'
  - '!lib/**/*.test.cjs'
  - '!lib/**/test-ports.cjs'
  # serialport trae binarios para todas las plataformas: solo se instala en Windows x64.
  - '!node_modules/@serialport/bindings-cpp/prebuilds/{android-*,darwin-*,linux-*,win32-arm64,win32-ia32}{,/**/*}'

# El binario nativo (.node) no puede cargarse desde dentro del asar.
asarUnpack:
  - 'node_modules/@serialport/bindings-cpp/prebuilds/win32-x64/**'

# Backend compilado + .env + node_modules de producción, fuera del asar.
# Lección de JJ: electron-builder omite node_modules en extraResources si no se declaran aparte.
extraResources:
  - from: build/backend
    to: backend
    filter:
      - '**/*'
      - '!node_modules{,/**/*}'
  - from: build/backend/node_modules
    to: backend/node_modules
    filter:
      - '**/*'

asar: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: '${productName}-Setup-${version}.${ext}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: PuntoVenta
  uninstallDisplayName: PuntoVenta
